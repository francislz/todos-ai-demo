name: Project status sync

# Claude sessions can only reach repo-scoped REST endpoints, so Claude cannot move cards on a
# GitHub Project (Projects v2 is GraphQL-only). Claude moves issues by swapping `status:*` labels;
# this workflow mirrors them to the Project's "Status" field:
#   status:in-progress → In Progress · status:in-review → In Review · status:blocked → Blocked
#   no status:* label  → Todo        · issue closed     → Done
#
# Setup (once): repo secret PROJECT_TOKEN (classic PAT with `project` + `repo` scopes, or a
# fine-grained PAT with Projects read/write) and repo variable PROJECT_NUMBER (the number in the
# Project URL). PROJECT_OWNER defaults to the repo owner.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

concurrency:
  group: project-status-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Status field from labels
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const { PROJECT_TOKEN, PROJECT_NUMBER, PROJECT_OWNER } = process.env;
            if (!PROJECT_TOKEN || !PROJECT_NUMBER) {
              core.notice('PROJECT_TOKEN secret or PROJECT_NUMBER variable not set; skipping board sync.');
              return;
            }

            const STATUS_BY_LABEL = {
              'status:blocked': 'Blocked',
              'status:in-review': 'In Review',
              'status:in-progress': 'In Progress',
            };
            const issue = context.payload.issue;
            const labels = issue.labels.map((l) => l.name);
            let target = 'Todo';
            if (issue.state === 'closed') target = 'Done';
            else {
              for (const [label, status] of Object.entries(STATUS_BY_LABEL)) {
                if (labels.includes(label)) { target = status; break; }
              }
            }

            const projectFragment = `
              projectV2(number: $number) {
                id
                field(name: "Status") {
                  ... on ProjectV2SingleSelectField { id options { id name } }
                }
              }`;
            const { repositoryOwner } = await github.graphql(
              `query($owner: String!, $number: Int!) {
                 repositoryOwner(login: $owner) {
                   ... on User { ${projectFragment} }
                   ... on Organization { ${projectFragment} }
                 }
               }`,
              { owner: PROJECT_OWNER, number: Number(PROJECT_NUMBER) },
            );
            const project = repositoryOwner?.projectV2;
            if (!project) throw new Error(`Project #${PROJECT_NUMBER} not found for ${PROJECT_OWNER}.`);
            const option = project.field?.options.find((o) => o.name.toLowerCase() === target.toLowerCase());
            if (!option) {
              core.warning(`Status option "${target}" does not exist in the project; add it to the Status field.`);
              return;
            }

            // Adding is idempotent: returns the existing item if the issue is already on the board.
            const { addProjectV2ItemById } = await github.graphql(
              `mutation($project: ID!, $content: ID!) {
                 addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
               }`,
              { project: project.id, content: issue.node_id },
            );
            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                 updateProjectV2ItemFieldValue(input: {
                   projectId: $project, itemId: $item, fieldId: $field,
                   value: { singleSelectOptionId: $option }
                 }) { projectV2Item { id } }
               }`,
              {
                project: project.id,
                item: addProjectV2ItemById.item.id,
                field: project.field.id,
                option: option.id,
              },
            );
            core.info(`#${issue.number} → ${target}`);
